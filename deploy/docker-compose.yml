services:
  api:
    build:
      context: ..
      dockerfile: PCTimeLimitServer/Dockerfile
    container_name: pctimelimit-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Security__JwtIssuer: ${PCTIMELIMIT_JWT_ISSUER}
      Security__JwtAudience: ${PCTIMELIMIT_JWT_AUDIENCE}
      Security__JwtSigningKey: ${PCTIMELIMIT_JWT_SIGNING_KEY}
      Security__OpsKey: ${PCTIMELIMIT_OPS_KEY}
      ConnectionStrings__DefaultConnection: Data Source=/var/lib/pctimelimit/pctimelimit.db
    volumes:
      - pctimelimit_data:/var/lib/pctimelimit
    expose:
      - "5005"

  nginx:
    image: nginx:1.27-alpine
    container_name: pctimelimit-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  pctimelimit_data:
